name: Run Telegram Bot

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Позволяет запускать вручную по кнопке в Actions
  schedule:
    # Перезапуск каждые 5 часов (максимальный лимит одного шага в GitHub Actions — 6 часов)
    - cron: '0 */5 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # Безопасный таймаут до принудительной остановки

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Telegram Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          python bot.py
