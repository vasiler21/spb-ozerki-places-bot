name: Run Telegram Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

# Автоматически останавливает старый запуск бота при старте нового
concurrency:
  group: telegram-bot-runner
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Telegram Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          python bot.py

      - name: Persist Discovered Places
        if: always()
        run: |
          git config --local user.email "bot-action@github.com"
          git config --local user.name "Bot Discovery Agent"
          if [ -f discovered_places.json ]; then
            git add discovered_places.json
            git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-discovery: save newly analyzed places [skip ci]" && git push)
          fi
